  to = "/billing"
  status = 302
  force = true

[[redirects]]
  from = "/settings/billing/"
  to = "/billing"
  status = 302
  force = true

# SPA fallback (paling akhir; file statis seperti /privacy.html, /sitemap.xml tetap dilayani apa adanya)
# Dashboard member (auth guard di /utils/btp-auth-guard.js)
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (anti clickjacking, MIME sniffing, dll.) untuk semua halaman
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Revalidate QRIS images so replaced payment codes are not kept in browser caches.
[[headers]]
  for = "/qris-*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[dev]
  targetPort = 8080

# Refresh payment UI after a deploy; payment API responses already use no-store.
[[headers]]
  for = "/pengaturan*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
