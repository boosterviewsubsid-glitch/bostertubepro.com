[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Build UNLOCKED 2026-10-17 untuk publish fix kuota + rotasi API key.
  # Untuk lock lagi (hemat credits), tambahkan kembali:
  # ignore = "echo 'BUILD LOCKED - hemat credits, unlock manual' && exit 0"

[build.environment]
  NPM_FLAGS = "--prefer-offline"
  # Redirect URI OAuth bukan rahasia (dikirim publik ke Google), jangan dianggap secret oleh scanner
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_OAUTH_REDIRECT"

[functions]
  node_bundler = "esbuild"
  # Timeout: function sinkron Netlify sudah berjalan hingga 60 detik (batas maksimum platform; tidak ada key
  # timeout di file ini). Upload AI dibatasi ~52 detik agar tetap balas pesan ramah, dan transkrip audio
  # berjalan sebagai background function (upload-transcribe-background, hingga 15 menit) + polling /api/transcribe.

# Domain utama: boostertubepro.netlify.app -> bostertubepro.com (cookie login & redirect OAuth harus di host yang sama)
[[redirects]]
  from = "/api/admin/stats"
  to = "/.netlify/functions/admin-stats"
  status = 200

[[redirects]]
  from = "/audit-channel"
  to = "/audit-channel.html"
  status = 200

[[redirects]]
  from = "/admin/moderasi"
  to = "/admin-moderasi.html"
  status = 200

[[redirects]]
  from = "/admin/komunikasi"
  to = "/admin-komunikasi.html"
  status = 200

[[redirects]]
  from = "/bantuan"
  to = "/bantuan.html"
  status = 200

[[redirects]]
  from = "https://boostertubepro.netlify.app/*"
  to = "https://bostertubepro.com/:splat"
  status = 301
  force = true

# Login Google OAuth (Hubungkan Channel YouTube)
[[redirects]]
  from = "/api/auth/youtube"
  to = "/.netlify/functions/youtube-auth"
  status = 200

# Authorized redirect URI Google OAuth (harus sama persis dengan Google Cloud Console)
[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/youtube-callback"
  status = 200

[[redirects]]
  from = "/api/auth/callback/google"
  to = "/.netlify/functions/youtube-callback"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/youtube-callback"
  status = 200

[[redirects]]
  from = "/api/auth/google/callback"
  to = "/.netlify/functions/youtube-callback"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/youtube-upload"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

