<!DOCTYPE html>
<html lang="id">
<head>
<!-- Auth guard: tanpa login langsung ke /login. Non-admin diarahkan ke /billing oleh script di bawah. -->
<script src="/utils/btp-auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Laporan Keuangan Admin - BosterTubePro</title>
<link rel="icon" type="image/png" href="/b-logo.png">
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/utils/credit.js"></script>
<script src="/utils/btp-auth.js"></script>
<script src="/utils/btp-bottom-nav.js" defer></script>
<link rel="stylesheet" href="/utils/cuan.css">
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:#f5f6ff;color:#121214;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
a{color:inherit}
.bill{max-width:1100px;margin:0 auto;padding:16px 16px 32px}
.bill-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bill-top img{width:36px;height:36px;border-radius:10px;background:#fff;object-fit:contain}
.bill-top h1{font-size:18px;font-weight:800;margin:0;line-height:1.2}
.bill-top h1 small{display:block;font-size:12px;font-weight:600;color:#6b7280}
.bill-top .back{margin-left:auto;font-size:12px;font-weight:700;text-decoration:none;border:1px solid #dcdcf0;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs a{font-size:13px;font-weight:700;text-decoration:none;border:1px solid #dcdcf0;background:#fff;border-radius:999px;padding:8px 14px}
.tabs a[aria-current]{background:#121214;color:#fde047;border-color:#121214}
#checking{font-size:13px;color:#6b7280}
footer{text-align:center;font-size:12px;color:#8b8ba3;padding:16px}
</style>
</head>
<body>
<main class="bill">
  <header class="bill-top">
    <img src="/b-logo.png" width="36" height="36" alt="Logo BosterTubePro">
    <h1>Laporan Keuangan<small>BosterTubePro · Admin</small></h1>
    <a class="back" href="/">← Dashboard</a>
  </header>
  <nav class="tabs" aria-label="Pengaturan">
    <a href="/pengaturan">Pengaturan</a>
    <a href="/billing">Billing &amp; Poin</a>
    <a href="/settings/laporan" aria-current="page">Laporan Keuangan</a>
  </nav>
  <p id="checking" role="status">Memeriksa akses admin…</p>
  <section id="cuan-root" hidden></section>
</main>
<footer><a href="/privacy-policy">Kebijakan Privasi</a> · <a href="/terms">Syarat Layanan</a> · <a href="/bantuan">Bantuan</a></footer>
<script src="/utils/cuan.js"></script>
<script>
(async () => {
  const status = document.getElementById('checking');
  const toBilling = () => location.replace('/billing');
  try {
    const r = await fetch('/api/billing', {headers: {'x-btp-session': localStorage.getItem('btp_session') || ''}, cache: 'no-store'});
    if (r.status === 401) { if (typeof endUserSession === 'function') endUserSession(); location.replace('/login?next=' + encodeURIComponent('/settings/laporan')); return; }
    const b = await r.json();
    // Hanya admin pemilik laporan; user biasa kembali ke /billing.
    if (!r.ok || b.canViewCuan !== true) return toBilling();
    status.remove();
    window.BTPCuan.setAccess(true);
  } catch { status.textContent = 'Akses belum dapat diperiksa. Muat ulang halaman.'; }
})();
</script>
</body>
</html>
